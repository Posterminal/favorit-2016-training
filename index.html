<script>
const API_URL = "https://neptun.in.ua/api/v1/alerts";
const DISTRICT_NAME = "Бориспільський район";
const OBLAST_NAME = "Київська область";

const trainings = [
  {
    dayNumber: 2,
    day: "Вівторок",
    time: "19:30 – 20:45",
    hour: 19,
    minute: 30,
    place: "Ліцей «Перспектива», Київський шлях, 97",
    map: "https://www.google.com/maps/search/?api=1&query=Ліцей+Перспектива,+Київський+шлях+97,+Бориспіль"
  },
  {
    dayNumber: 3,
    day: "Середа",
    time: "19:35 – 20:50",
    hour: 19,
    minute: 35,
    place: "Ліцей П. Чубинського, Головатого, 32-А",
    map: "https://www.google.com/maps/search/?api=1&query=Ліцей+Павла+Чубинського,+Головатого+32-А,+Бориспіль"
  },
  {
    dayNumber: 5,
    day: "П’ятниця",
    time: "19:35 – 20:50",
    hour: 19,
    minute: 35,
    place: "Ліцей П. Чубинського, Головатого, 32-А",
    map: "https://www.google.com/maps/search/?api=1&query=Ліцей+Павла+Чубинського,+Головатого+32-А,+Бориспіль"
  }
];

function getNextTraining() {
  const now = new Date();
  let closest = null;

  for (let addDays = 0; addDays < 8; addDays++) {
    const date = new Date(now);
    date.setDate(now.getDate() + addDays);

    for (const training of trainings) {
      if (date.getDay() !== training.dayNumber) continue;

      const start = new Date(date);
      start.setHours(training.hour, training.minute, 0, 0);

      if (start > now && (!closest || start < closest.start)) {
        closest = {
          ...training,
          start
        };
      }
    }
  }

  return closest;
}

function getTodayTrainingState() {
  const now = new Date();

  const training = trainings.find(
    item => item.dayNumber === now.getDay()
  );

  if (!training) return null;

  const start = new Date(now);
  start.setHours(training.hour, training.minute, 0, 0);

  const waitUntil = new Date(
    start.getTime() + 30 * 60 * 1000
  );

  return {
    training,
    start,
    waitUntil,
    isAfterStart: now >= start,
    isAfterWaitingPeriod: now >= waitUntil
  };
}

function updateTrainingCard() {
  const next = getNextTraining();
  if (!next) return;

  document.getElementById("nextDay").textContent = next.day;
  document.getElementById("nextTime").textContent = next.time;
  document.getElementById("nextPlace").textContent = next.place;
  document.getElementById("routeLink").href = next.map;

  const diff = Math.max(0, next.start.getTime() - Date.now());

  const days = Math.floor(diff / 86400000);
  const hours = Math.floor(
    (diff % 86400000) / 3600000
  );
  const minutes = Math.floor(
    (diff % 3600000) / 60000
  );
  const seconds = Math.floor(
    (diff % 60000) / 1000
  );

  document.getElementById("countdown").textContent =
    (days > 0 ? `${days} дн. ` : "") +
    `${String(hours).padStart(2, "0")}:` +
    `${String(minutes).padStart(2, "0")}:` +
    `${String(seconds).padStart(2, "0")}`;
}

function parseDate(value) {
  if (!value) return null;

  const date = new Date(value);

  return Number.isNaN(date.getTime())
    ? null
    : date;
}

function formatAlertTime(value) {
  const date = parseDate(value);

  if (!date) return "час невідомий";

  return date.toLocaleString("uk-UA", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function formatUpdateTime(value) {
  const date = parseDate(value);

  if (!date) return "час оновлення невідомий";

  return date.toLocaleTimeString("uk-UA", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}

function setAlarmAppearance({
  icon,
  title,
  text,
  background,
  border,
  titleColor,
  textColor,
  dotColor,
  updatedAt
}) {
  const card = document.getElementById("alarmCard");
  const alarmIcon = document.getElementById("alarmIcon");
  const alarmTitle = document.getElementById("alarmTitle");
  const alarmText = document.getElementById("alarmText");
  const trainingRule = document.getElementById("trainingRule");
  const alarmMapLink = document.getElementById("alarmMapLink");
  const alarmDot = document.getElementById("alarmDot");
  const alarmUpdated = document.getElementById("alarmUpdated");

  if (
    !card ||
    !alarmIcon ||
    !alarmTitle ||
    !alarmText ||
    !trainingRule ||
    !alarmMapLink ||
    !alarmDot ||
    !alarmUpdated
  ) {
    return;
  }

  card.style.background = background;
  card.style.borderColor = border;

  alarmIcon.textContent = icon;
  alarmTitle.textContent = title;
  alarmTitle.style.color = titleColor;

  alarmText.textContent = text;
  alarmText.style.color = textColor;

  trainingRule.style.color = textColor;
  trainingRule.style.borderTopColor = border;

  alarmMapLink.style.background = titleColor;
  alarmDot.style.background = dotColor;

  alarmUpdated.innerHTML = `
    Оновлено: ${formatUpdateTime(updatedAt)} ·
    <a
      href="https://neptun.in.ua/"
      target="_blank"
      rel="noopener"
      style="color:inherit;font-weight:700"
    >Дані: Карта повітряних тривог — NEPTUN</a>
    <br>
    ⚠️ NEPTUN — інформаційний агрегатор.
    Обов’язково перевіряйте офіційні джерела.
  `;
}

function showAlarmCard({
  active,
  changed,
  updatedAt,
  scope
}) {
  const trainingState = getTodayTrainingState();
  const alertStartedAt = parseDate(changed);

  /*
    Правило очікування 30 хвилин застосовується лише тоді,
    коли тривога вже була активною на момент початку заняття.
  */
  const alertWasActiveAtStart =
    active &&
    trainingState &&
    alertStartedAt &&
    alertStartedAt <= trainingState.start;

  if (!active) {
    setAlarmAppearance({
      icon: "🟢",
      title: "Активної тривоги немає",
      text:
        "За даними NEPTUN, у Бориспільському районі активної " +
        "повітряної тривоги зараз немає. Перед виїздом " +
        "обов’язково перевірте офіційні джерела.",
      background: "#e8f8f1",
      border: "#9edbbf",
      titleColor: "#11865b",
      textColor: "#176244",
      dotColor: "#18a66b",
      updatedAt
    });

    return;
  }

  if (
    alertWasActiveAtStart &&
    trainingState.isAfterStart &&
    !trainingState.isAfterWaitingPeriod
  ) {
    const millisecondsLeft =
      trainingState.waitUntil.getTime() - Date.now();

    const minutesLeft = Math.max(
      1,
      Math.ceil(millisecondsLeft / 60000)
    );

    setAlarmAppearance({
      icon: "🟡",
      title: `Чекаємо відбій — залишилось ${minutesLeft} хв.`,
      text:
        "На момент початку тренування повітряна тривога була " +
        "активною. Чекаємо відбою до 30 хвилин після початку. " +
        "Обов’язково перевірте офіційні джерела.",
      background: "#fff5d9",
      border: "#f1d787",
      titleColor: "#a86500",
      textColor: "#674800",
      dotColor: "#f0a500",
      updatedAt
    });

    return;
  }

  if (
    alertWasActiveAtStart &&
    trainingState.isAfterWaitingPeriod
  ) {
    setAlarmAppearance({
      icon: "⚫",
      title: "Тренування сьогодні не відбудеться",
      text:
        "Минуло 30 хвилин від початку тренування, а тривога " +
        "досі активна. Перевірте офіційні повідомлення та " +
        "дотримуйтеся правил безпеки.",
      background: "#f0f1f3",
      border: "#c8cbd1",
      titleColor: "#30343b",
      textColor: "#4c535d",
      dotColor: "#30343b",
      updatedAt
    });

    return;
  }

  setAlarmAppearance({
    icon: "🔴",
    title:
      scope === OBLAST_NAME
        ? "Повітряна тривога в Київській області"
        : "Повітряна тривога в Бориспільському районі",
    text:
      `Тривога активна з ${formatAlertTime(changed)}. ` +
      "Дотримуйтеся правил безпеки та обов’язково перевірте " +
      "офіційні джерела.",
    background: "#ffebed",
    border: "#f0a9b0",
    titleColor: "#bf2935",
    textColor: "#84232c",
    dotColor: "#e4333e",
    updatedAt
  });
}

function showAlarmError() {
  setAlarmAppearance({
    icon: "⚠️",
    title: "Не вдалося перевірити статус тривоги",
    text:
      "Статус зараз невідомий. Не вважайте це відсутністю " +
      "тривоги. Перед виїздом обов’язково перевірте офіційні " +
      "джерела оповіщення.",
    background: "#fff5d9",
    border: "#f1d787",
    titleColor: "#a86500",
    textColor: "#674800",
    dotColor: "#f0a500",
    updatedAt: null
  });
}

async function updateAlarmStatus() {
  try {
    const response = await fetch(API_URL, {
      method: "GET",
      cache: "no-store",
      headers: {
        Accept: "application/json"
      }
    });

    if (!response.ok) {
      throw new Error(
        `NEPTUN повернув HTTP ${response.status}`
      );
    }

    const data = await response.json();

    if (
      !Array.isArray(data.raions) ||
      !Array.isArray(data.oblasts)
    ) {
      throw new Error(
        "Некоректний формат відповіді NEPTUN"
      );
    }

    /*
      Перевіряємо саме Бориспільський район.
      Додатково враховуємо тривогу для всієї Київської області.
    */
    const districtAlert = data.raions.find(item =>
      item.name === DISTRICT_NAME &&
      item.oblast === OBLAST_NAME
    );

    const oblastAlert = data.oblasts.find(item =>
      item.name === OBLAST_NAME ||
      item.oblast === OBLAST_NAME
    );

    const currentAlert =
      districtAlert || oblastAlert || null;

    /*
      Якщо відповідь надто стара, не показуємо зелений статус.
    */
    const serverUpdate = parseDate(data.updatedAt);

    if (
      !serverUpdate ||
      Date.now() - serverUpdate.getTime() > 10 * 60 * 1000
    ) {
      throw new Error(
        "Дані NEPTUN не оновлювалися понад 10 хвилин"
      );
    }

    showAlarmCard({
      active: Boolean(currentAlert),
      changed: currentAlert?.since || null,
      updatedAt: data.updatedAt,
      scope: districtAlert
        ? DISTRICT_NAME
        : oblastAlert
          ? OBLAST_NAME
          : DISTRICT_NAME
    });
  } catch (error) {
    console.error("Помилка NEPTUN API:", error);
    showAlarmError();
  }
}

updateTrainingCard();
updateAlarmStatus();

setInterval(updateTrainingCard, 1000);
setInterval(updateAlarmStatus, 60000);
</script>
